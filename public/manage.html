<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Zcalendar</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="shell topbar-inner">
        <a class="brand" href="/"><span class="brand-mark">Z</span>Zcalendar</a>
        <div class="topbar-actions">
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" data-action="lang" data-set-lang="zh">中</button>
            <button type="button" data-action="lang" data-set-lang="en">EN</button>
          </div>
          <button
            type="button"
            class="icon-btn"
            data-action="theme"
            data-i18n-title="toggleTheme"
          >
            <svg
              class="icon-sun"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2" />
              <path d="M12 20v2" />
              <path d="m4.93 4.93 1.41 1.41" />
              <path d="m17.66 17.66 1.41 1.41" />
              <path d="M2 12h2" />
              <path d="M20 12h2" />
              <path d="m6.34 17.66-1.41 1.41" />
              <path d="m19.07 4.93-1.41 1.41" />
            </svg>
            <svg
              class="icon-moon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="shell manage-shell">
      <div id="accessDenied" class="lock-screen" hidden>
        <div class="lock-box">
          <span class="lock-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </span>
          <h1 class="lock-title" data-i18n="needManage"></h1>
          <p class="lock-meta muted" data-i18n="needManageHint"></p>
          <a class="btn ghost" href="/" data-i18n="backHome"></a>
        </div>
      </div>

      <div id="manageApp" hidden>
        <header class="manage-head">
          <div class="manage-head-copy">
            <h1 id="calName" class="page-title"></h1>
            <p id="calMeta" class="muted"></p>
          </div>
          <div class="segmented tabs" role="tablist">
            <button type="button" data-tab="events" data-i18n="events"></button>
            <button type="button" data-tab="subscriptions" data-i18n="subscriptions"></button>
            <button type="button" data-tab="settings" data-i18n="settings"></button>
          </div>
        </header>

        <p id="pageError" class="form-error" role="alert" hidden></p>

        <section id="tab-events" class="panel" data-panel="events">
          <div class="section-head">
            <h2 data-i18n="events"></h2>
            <button id="addEventBtn" class="btn primary small" type="button">
              <span data-i18n="addEvent"></span>
            </button>
          </div>
          <div id="eventList" class="day-list"></div>
          <p id="noEvents" class="empty-state" data-i18n="noEvents" hidden></p>
        </section>

        <section id="tab-subscriptions" class="panel" data-panel="subscriptions" hidden>
          <div class="section-head">
            <h2 data-i18n="subscriptions"></h2>
          </div>
          <p class="muted section-hint" data-i18n="subHint"></p>
          <form id="subForm" class="inline-form">
            <input
              id="subNameInput"
              class="text-input"
              type="text"
              maxlength="60"
              required
              data-i18n-placeholder="subNamePlaceholder"
            />
            <button id="addSubBtn" class="btn primary small" type="submit">
              <span data-i18n="addSubscription"></span>
            </button>
          </form>
          <div id="subList" class="sub-list"></div>
          <p id="noSubs" class="empty-state" data-i18n="noSubscriptions" hidden></p>
        </section>

        <section id="tab-settings" class="panel" data-panel="settings" hidden>
          <div class="section-head">
            <h2 data-i18n="settings"></h2>
          </div>
          <form id="settingsForm" class="settings-form">
            <label class="field">
              <span class="field-label" data-i18n="calNameLabel"></span>
              <input id="settingsName" class="text-input" type="text" maxlength="80" required />
            </label>
            <label class="field">
              <span class="field-label" data-i18n="timezone"></span>
              <select id="settingsTz" class="text-input"></select>
            </label>
            <button id="saveSettingsBtn" class="btn primary small" type="submit">
              <span data-i18n="saveSettings"></span>
            </button>
          </form>

          <div class="settings-danger">
            <div class="section-head">
              <h2 data-i18n="manageLinkSection"></h2>
            </div>
            <p class="muted section-hint" data-i18n="manageLinkHint"></p>
            <button id="resetManageBtn" class="btn ghost small" type="button">
              <span data-i18n="resetManageLink"></span>
            </button>
          </div>
        </section>
      </div>
    </main>

    <div id="eventModal" class="modal-overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h3 id="eventModalTitle" data-i18n="newEvent"></h3>
          <button id="closeEventModal" class="icon-btn small" type="button" aria-label="Close">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>
        <form id="eventForm" class="modal-body">
          <label class="field">
            <span class="field-label" data-i18n="eventTitle"></span>
            <input
              id="eventTitle"
              class="text-input"
              type="text"
              maxlength="200"
              required
              data-i18n-placeholder="titlePlaceholder"
            />
          </label>
          <label class="check-field">
            <input id="eventAllDay" type="checkbox" />
            <span data-i18n="allDay"></span>
          </label>
          <div class="field-grid">
            <label class="field">
              <span class="field-label" data-i18n="startsAt"></span>
              <input id="eventStart" class="text-input" type="text" required />
            </label>
            <label class="field">
              <span class="field-label" data-i18n="endsAt"></span>
              <input id="eventEnd" class="text-input" type="text" required />
              <span id="endHint" class="field-hint" data-i18n="endExclusiveHint" hidden></span>
            </label>
          </div>
          <label class="field">
            <span class="field-label">
              <span data-i18n="location"></span>
              <span class="optional-badge" data-i18n="optionalShort"></span>
            </span>
            <input
              id="eventLocation"
              class="text-input"
              type="text"
              maxlength="500"
              data-i18n-placeholder="locationPlaceholder"
            />
          </label>
          <label class="field">
            <span class="field-label">
              <span data-i18n="description"></span>
              <span class="optional-badge" data-i18n="optionalShort"></span>
            </span>
            <textarea id="eventDesc" class="text-input" rows="2" maxlength="2000"></textarea>
          </label>
          <details class="advanced-options">
            <summary>
              <span class="summary-copy">
                <span class="summary-text" data-i18n="rrule"></span>
                <span class="summary-meta" data-i18n="rruleHint"></span>
              </span>
              <svg class="chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m6 9 6 6 6-6" />
              </svg>
            </summary>
            <div class="advanced-body">
              <input
                id="eventRrule"
                class="text-input"
                type="text"
                maxlength="500"
                spellcheck="false"
                data-i18n-placeholder="rrulePlaceholder"
              />
            </div>
          </details>
          <p id="eventError" class="form-error" role="alert" hidden></p>
          <div class="modal-actions">
            <button id="deleteEventBtn" class="btn ghost small" type="button" hidden>
              <span data-i18n="delete"></span>
            </button>
            <span class="modal-actions-spacer"></span>
            <button id="cancelEventBtn" class="btn ghost small" type="button">
              <span data-i18n="cancel"></span>
            </button>
            <button id="saveEventBtn" class="btn primary small" type="submit">
              <span id="saveEventLabel" data-i18n="save"></span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <div id="secretModal" class="modal-overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h3 id="secretTitle"></h3>
          <button id="closeSecretModal" class="icon-btn small" type="button" aria-label="Close">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <p id="secretWarning" class="warn-box" hidden></p>
          <label class="field">
            <span class="field-label" id="secretLabel"></span>
            <input id="secretValue" class="text-input" type="text" readonly />
          </label>
          <div class="modal-actions">
            <span class="modal-actions-spacer"></span>
            <button id="copySecretBtn" class="btn ghost small" type="button">
              <span id="copySecretLabel" data-i18n="copyLink"></span>
            </button>
            <button id="doneSecretBtn" class="btn primary small" type="button">
              <span data-i18n="close"></span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="/site.js"></script>
    <script src="/manage.js"></script>
  </body>
</html>
